name: Customization checks
on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: ['codex/rex-custom']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: custom/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node custom/scripts/check-public-tree.mjs
        working-directory: .
